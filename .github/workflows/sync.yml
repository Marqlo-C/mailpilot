name: Hourly Job Sync

'on':
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  cron-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MailPilot Sync Endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://mailpilot-prod.vercel.app/api/cron/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "Sync endpoint responded with HTTP $response"

          if [ "$response" -ne 200 ]; then
            echo "Cron sync failed with HTTP $response"
            exit 1
          fi