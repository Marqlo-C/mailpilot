name: CI & Deployment Gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Next.js Linter
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Dry-Run Production Build
        run: npm run build

      - name: Build & Package Chrome Extension
        run: npm run package:extension

      - name: Upload Chrome Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailpilot-chrome-extension
          path: mailpilot-extension.zip
          retention-days: 30

      - name: Publish GitHub Release Asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'companion-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Mail Pilot + Companion (Latest)' }}
          body: |
            Automated production build of the **Mail Pilot + Companion** Chrome Extension.

            ### Installation Instructions
            1. Download `mailpilot-extension.zip` below.
            2. Extract the ZIP file to a folder on your computer.
            3. Open Google Chrome and navigate to `chrome://extensions/`.
            4. Enable **Developer mode** using the toggle in the top-right corner.
            5. Click **Load unpacked** and select the extracted folder.
          files: mailpilot-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
